services:
  # Fast-Path In-Memory Store (Atomic Lua Scripts, Sliding Limit Counter)
  redis:
    image: redis:7.2-alpine
    container_name: kaspi-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Apache Kafka (KRaft mode - no zookeeper required)
  kafka:
    image: bitnami/kafka:3.7.0
    container_name: kaspi-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL 16 (Immutable Double-Entry Ledger and Rules DB)
  postgres:
    image: postgres:16-alpine
    container_name: kaspi-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=kaspi
      - POSTGRES_PASSWORD=kaspi_secret
      - POSTGRES_DB=kaspi_ledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaspi -d kaspi_ledger"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Elasticsearch 8 (Real-Time Burn Rate, Loyalty Marketing Analytics)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: kaspi-elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kibana 8 (Analytics Dashboards)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.14.0
    container_name: kaspi-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy

  # Distributed Tracing (Zipkin)
  zipkin:
    image: openzipkin/zipkin:3.3
    container_name: kaspi-zipkin
    ports:
      - "9411:9411"

volumes:
  postgres_data:
